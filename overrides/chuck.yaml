# CHUCK position gateway: receive NMEA 0183 over TCP/UDP from devices on the internet.
# The host port is 10120 because eNMEA2000 already holds 10110 on this VM (overrides/enmea.yaml).
# Every sender must send its station's stream key; an IP address alone is not accepted
# (bin/check-config.sh refuses to start otherwise). The web screen and APIs stay on 127.0.0.1;
# Caddy publishes only the admin page at https://gateway.<CHUCK_DOMAIN>, so its session cookie is Secure.
services:
  position-gateway:
    ports: !override
      - "127.0.0.1:18083:8001"
      - "10120:10110/tcp"
      - "10120:10110/udp"
    environment:
      HF_GATEWAY_NMEA_STREAM: "1"
      HF_GATEWAY_NMEA_REQUIRE_KEY: "1"
      HF_GATEWAY_UI_SECURE_COOKIE: "1"

  # Simulator control panel for testing the gateway (CHUCK scripts/gateway_simulator.py serve).
  # It has no login of its own: Caddy serves it at sim.<CHUCK_DOMAIN> behind the CHUCK admin password.
  # It sends to the gateway inside the compose network, so it does not test the internet path.
  gateway-simulator:
    image: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    command: ["python", "/chuck/scripts/gateway_simulator.py", "serve",
              "--url", "http://position-gateway:8001", "--nmea-host", "position-gateway", "--nmea-port", "10110",
              "--bind", "0.0.0.0", "--port", "8090", "--allow-host", "sim.${CHUCK_DOMAIN}", "--interval", "5"]
    environment:
      HF_POSITION_INGEST_TOKEN: "${HF_POSITION_INGEST_TOKEN:-}"
      HF_POSITION_GATEWAY_TOKEN: "${HF_POSITION_GATEWAY_TOKEN:-}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/chuck:ro
    user: "10001:10001"
    read_only: true
    depends_on:
      - position-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
