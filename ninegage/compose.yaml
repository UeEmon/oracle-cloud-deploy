# Nine-Gage's own VM: one HTTPS entrance (Caddy) in front of production and staging, plus the papercraft generator
# (moved here from papercraft-1 on 2026-11-16), which only production reaches over its own network,
# and the layout sharing site "みんなのレイアウト" (share.<NINEGAGE_DOMAIN>, added 2026-11-18) in its own container.
#   cd ~/oracle-cloud-deploy/ninegage && bin/init-secrets.sh && bin/check-config.sh && bin/up.sh
# The images come from the app's CI (ghcr.io): :stable = the latest release tag v*, :main = the latest merge.
# Each app sits on its own network shared only with Caddy, so production and staging cannot reach each other.
name: ninegage

x-hardening: &hardening
  user: node
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m
    - /app/.next/cache:size=64m,uid=1000,gid=1000
  pids_limit: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "3"

services:
  nine-gage:
    <<: *hardening
    image: ghcr.io/ueemon/nine-gage-systems:${NINEGAGE_TAG:-stable}
    expose:
      - "3000"
    # First admin, NINEGAGE_SECRET_KEY, NINEGAGE_BACKUP_KEY, mail and fallback AI keys (bin/init-secrets.sh).
    # env/papercraft.env adds PAPERCRAFT_API_TOKEN, the same value the generator checks.
    # env/share-link.env adds SENROLAB_SHARE_SECRET, the same key the sharing site checks the login handoff with.
    env_file:
      - env/ninegage.env
      - env/papercraft.env
      - env/share-link.env
    environment:
      NODE_ENV: production
      NINEGAGE_DATA_DIR: /data
      PAPERCRAFT_URL: http://papercraft:8086
      # The sharing site. Fixed here so the login handoff only ever returns there.
      SENROLAB_SHARE_URL: "https://share.${NINEGAGE_DOMAIN:?set NINEGAGE_DOMAIN in .env}"
      # Links in the sign-up confirmation mail. Fixed here so a forged Host header cannot change them.
      NINEGAGE_PUBLIC_URL: "https://${NINEGAGE_DOMAIN:?set NINEGAGE_DOMAIN in .env}"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ninegage-data:/data
    networks:
      - prod-edge
      - papercraft
    mem_limit: 1g
    cpus: 0.75

  nine-gage-staging:
    <<: *hardening
    image: ghcr.io/ueemon/nine-gage-systems:main
    expose:
      - "3000"
    # Its own first admin and keys, no mail (sign-up closed), no AI keys.
    env_file: env/ninegage-staging.env
    environment:
      NODE_ENV: production
      NINEGAGE_DATA_DIR: /data
      NINEGAGE_PUBLIC_URL: "https://staging.${NINEGAGE_DOMAIN:?set NINEGAGE_DOMAIN in .env}"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ninegage-staging-data:/data
    networks:
      - staging-edge
    mem_limit: 512m
    cpus: 0.25

  # The papercraft generator: no host port, no internet entrance. Only nine-gage shares its network.
  papercraft:
    image: ghcr.io/ueemon/ai-paper-modelar:${PAPERCRAFT_TAG:-stable}
    expose:
      - "8086"
    # PAPERCRAFT_API_TOKEN (bin/init-secrets.sh).
    env_file: env/papercraft.env
    # The image already runs as a non-root user (Dockerfile USER app).
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    networks:
      - papercraft
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # The layout sharing site (share/ in Nine-Gage-Systems). Its own data; logins come from production through a signed
  # handoff (SENROLAB_SHARE_SECRET), so it never sees passwords. It talks to no other container; only Caddy reaches it.
  share:
    image: ghcr.io/ueemon/nine-gage-share:${SHARE_TAG:-stable}
    expose:
      - "3100"
    # SHARE_SESSION_SECRET (env/share.env) and SENROLAB_SHARE_SECRET (env/share-link.env, shared with nine-gage).
    env_file:
      - env/share.env
      - env/share-link.env
    environment:
      NODE_ENV: production
      SHARE_DATA_DIR: /data
      SENROLAB_URL: "https://${NINEGAGE_DOMAIN:?set NINEGAGE_DOMAIN in .env}"
      NEXT_TELEMETRY_DISABLED: "1"
    user: node
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/share/.next/cache:size=64m,uid=1000,gid=1000
    volumes:
      - share-data:/data
    networks:
      - share-edge
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  https-proxy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NINEGAGE_DOMAIN: "${NINEGAGE_DOMAIN:?set NINEGAGE_DOMAIN in .env}"
    # NINEGAGE_STAGING_USER and NINEGAGE_STAGING_PASSWORD_HASH (bin/init-secrets.sh).
    env_file: env/staging-auth.env
    volumes:
      # The directory, not the file, so a git pull that replaces the Caddyfile is seen by caddy reload.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - prod-edge
      - staging-edge
      - share-edge
    depends_on:
      - nine-gage
      - nine-gage-staging
      - share
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  prod-edge:
  staging-edge:
  papercraft:
  share-edge:

volumes:
  ninegage-data:
  ninegage-staging-data:
  share-data:
  caddy-data:
  caddy-config:
