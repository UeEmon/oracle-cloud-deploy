#cloud-config
# papercraft-1: Ubuntu 24.04 aarch64 on Oracle Cloud. Like ../cloud-init.yaml, but opens no web ports:
# only 8086 from Nine-Gage's subnet (10.0.1.0/24). The security list papercraft-sl allows the same.
package_update: true
packages:
  - ca-certificates
  - git
  - iptables-persistent
apt:
  sources:
    docker.list:
      source: deb [signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
runcmd:
  # OCI Ubuntu images reject inbound traffic except SSH in the host firewall.
  - iptables -I INPUT 5 -p tcp -s 10.0.1.0/24 --dport 8086 -m state --state NEW -j ACCEPT
  - netfilter-persistent save
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - sudo -u ubuntu git clone https://github.com/UeEmon/oracle-cloud-deploy.git /home/ubuntu/oracle-cloud-deploy
