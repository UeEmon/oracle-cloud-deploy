# One VM, several systems, one HTTPS entrance.
#   bin/fetch-apps.sh          # clone or update the apps under apps/
#   docker compose up -d --build
# Each app keeps its own compose file and settings; this file only adds Caddy.
include:
  - path: apps/VOCAP-COMPATIBILITY-/compose.yaml
  - path: apps/ai-requirements-navigator/deploy/docker/compose.yml
    env_file: env/arn.env

services:
  https-proxy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CHUCK_DOMAIN: "${CHUCK_DOMAIN:?set CHUCK_DOMAIN in .env}"
      CHUCK_USER: "${CHUCK_USER:?set CHUCK_USER in .env}"
      CHUCK_PASSWORD_HASH: "${CHUCK_PASSWORD_HASH:?set CHUCK_PASSWORD_HASH in .env}"
      ARN_DOMAIN: "${ARN_DOMAIN:?set ARN_DOMAIN in .env}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hf-propagation
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
