# One VM, several systems, one HTTPS entrance.
#   bin/fetch-apps.sh          # clone or update the apps under apps/
#   docker compose up -d --build
# Each app keeps its own compose file and settings; this file only adds Caddy.
include:
  # The public edition: the app's own compose plus its public-mode override.
  - path:
      - apps/CHUCK/compose.yaml
      - apps/CHUCK/compose.public.yaml
      - overrides/chuck.yaml
    env_file: .env
  - path:
      - apps/ai-requirements-navigator/deploy/docker/compose.yml
      - overrides/arn.yaml
    env_file: env/arn.env
  - path: apps/BACCHUS-SYSTEM/compose.yaml
    env_file: env/bacchus.env

services:
  ocean-data:
    build: ./apps/OpenWeather/collector
    expose:
      - "8080"
    environment:
      DATA_PATH: /data/ocean.sqlite3
      COLLECT_INTERVAL_SECONDS: "1800"
    volumes:
      - ocean-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  https-proxy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CHUCK_DOMAIN: "${CHUCK_DOMAIN:?set CHUCK_DOMAIN in .env}"
      CHUCK_USER: "${CHUCK_USER:?set CHUCK_USER in .env}"
      CHUCK_PASSWORD_HASH: "${CHUCK_PASSWORD_HASH:?set CHUCK_PASSWORD_HASH in .env}"
      CHUCK_ADMIN_SECRET: "${CHUCK_ADMIN_SECRET:?set CHUCK_ADMIN_SECRET in .env}"
      ARN_DOMAIN: "${ARN_DOMAIN:?set ARN_DOMAIN in .env}"
      ARN_UPSTREAM: arn-app:8787
      NO_PROXY: ocean-data,hf-propagation,position-gateway,public-data,gateway-simulator,arn-app,bacchus,localhost,127.0.0.1
      no_proxy: ocean-data,hf-propagation,position-gateway,public-data,gateway-simulator,arn-app,bacchus,localhost,127.0.0.1
    volumes:
      - ./apps/OpenWeather:/srv/openweather:ro
      # The directory, not the file: git pull replaces the Caddyfile with a new inode, which a
      # single-file bind mount never sees, so the reload in bin/up.sh would keep the old config.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hf-propagation
      - position-gateway
      - app
      - bacchus
      - ocean-data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  ocean-data:
  caddy-data:
  caddy-config:
